# Publishes to npm when a v* tag on main is pushed (npm version patch && git push --follow-tags).
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance is automatic.
# Two jobs on purpose: `build` runs the repository's code and has no OIDC token; `publish` holds the
# token, needs a reviewer's approval through the `npm` environment, and only uploads the tarball that
# `build` made, with scripts off. Setup: PUBLISHING.md.
name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # the check below needs main's history
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.0
          package-manager-cache: false # never use caching in release builds
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check that the tag matches package.json and server.json
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          test "v$(node -p 'require("./server.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --silent)"
          {
            echo "name=$(node -p 'require("./package.json").name')"
            echo "version=$(node -p 'require("./package.json").version')"
            echo "tarball=$tarball"
            echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm # required reviewers are set on this environment
    permissions:
      id-token: write # OIDC token for npm trusted publishing
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tarball
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the npm that trusted publishing needs
        run: npm install --global --ignore-scripts npm@11.21.1
      - name: Check that this is the tarball that was built and tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check
      - name: Skip versions that are already on npm
        id: published
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the built tarball
        if: steps.published.outputs.skip != 'true'
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --ignore-scripts --access public
